<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <h1 class=" text-center p-5 ">ROCK-PAPER-SCISSOR</h1>
    <div class="container text-center">
        <div class="row justify-content-between">
        <button class="col m-2" onclick="playRock()">Rock</button>
        <button class="col m-2" onclick="playPaper()">Paper</button>
        <button class="col m-2" onclick="playScissor()">Scissor</button>
        </div>
    </div>
    
    <script>
        const ROCK = 0;
        const PAPER = 1;
        const SCISSOR = 2;

        function getComputerMove() {
            return Math.floor(Math.random() * 3);
        }

        function getGameResult(playerMove, computerMove) {
            const moves = ['rock', 'paper', 'scissor'];
            const computerMoveText = moves[computerMove];
            
            if (playerMove === computerMove) {
                return `Computer picked ${computerMoveText}. It's a tie!`;
            }
            
            if (
                (playerMove === ROCK && computerMove === SCISSOR) ||
                (playerMove === PAPER && computerMove === ROCK) ||
                (playerMove === SCISSOR && computerMove === PAPER)
            ) {
                return `Computer picked ${computerMoveText}. You win!`;
            }
            
            return `Computer picked ${computerMoveText}. You lose!`;
        }

        function playRock() {
            const computerMove = getComputerMove();
            const result = getGameResult(ROCK, computerMove);
            console.log(result);
            alert(result);
        }

        function playPaper() {
            const computerMove = getComputerMove();
            const result = getGameResult(PAPER, computerMove);
            console.log(result);
            alert(result);
        }

        function playScissor() {
            const computerMove = getComputerMove();
            const result = getGameResult(SCISSOR, computerMove);
            console.log(result);
            alert(result);
        }
        </script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
